$schema: https://azuremlschemas.azureedge.net/latest/commandJob.schema.json
type: command
display_name: stage2-08-gold-sampling-1p5b
experiment_name: rlvr-group-correlation

code: ../src
command: >-
  python gold_sampling.py
  --rollouts ${{inputs.rollouts}}
  --verdicts ${{inputs.verdicts}}
  --out ${{outputs.gold}}/gold_set_1p5b.csv
  --only_model qwen2.5-1.5b
  --per_cell 300
  --double_annotate_n 200

environment: azureml:rlvr-stage1-cpu@latest
compute: azureml:cpu-audit-cluster

inputs:
  rollouts:
    type: uri_folder
    mode: ro_mount
    path: azureml://datastores/workspaceblobstore/paths/rlvr_group_corr/rollouts/
  verdicts:
    type: uri_folder
    mode: ro_mount
    path: azureml://datastores/workspaceblobstore/paths/rlvr_group_corr/verdicts_1p5b/

outputs:
  gold:
    type: uri_folder
    mode: rw_mount
    path: azureml://datastores/workspaceblobstore/paths/rlvr_group_corr/gold/
