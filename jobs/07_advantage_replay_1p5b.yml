$schema: https://azuremlschemas.azureedge.net/latest/commandJob.schema.json
type: command
display_name: stage2-07-advantage-replay-1p5b
experiment_name: rlvr-group-correlation

code: ../src
command: >-
  python advantage_replay.py
  --rollouts ${{inputs.rollouts}}
  --verdicts ${{inputs.verdicts}}
  --out ${{outputs.report}}/replay_report_1p5b.json
  --only_model qwen2.5-1.5b

environment: azureml:rlvr-stage1-cpu@latest
compute: azureml:cpu-audit-cluster

inputs:
  rollouts:
    type: uri_folder
    mode: ro_mount
    path: azureml://datastores/workspaceblobstore/paths/rlvr_group_corr/rollouts/
  verdicts:
    type: uri_folder
    mode: ro_mount
    path: azureml://datastores/workspaceblobstore/paths/rlvr_group_corr/verdicts_1p5b/

outputs:
  report:
    type: uri_folder
    mode: rw_mount
    path: azureml://datastores/workspaceblobstore/paths/rlvr_group_corr/replay/
